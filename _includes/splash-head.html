
<script>
  (function () {
    var html = document.documentElement;
    html.classList.add('js');
    try {
      if (localStorage.getItem('splashSeen') === '1') {
        html.classList.add('splash-seen');
      }
    } catch (err) { /* localStorage unavailable — splash just plays every time */ }
  })();
</script>
