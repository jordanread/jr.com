<section id="elsewhere" aria-label="Elsewhere">
  <h2><span>Elsewhere</span></h2>
  <div class="section-card section-intro">
    <p>
      Not everything worth knowing about me fits under "Software Engineer."
    </p>
  </div>
  <div class="project-grid">
    {% for item in site.data.elsewhere %}
    <div class="project-card elsewhere-card">
      <div class="project-card-header">
        <h3 class="project-card-title">{{ item.title }}</h3>
        {% if item.tag %}
        <span class="pill">{{ item.tag }}</span>
        {% endif %}
      </div>
      <p class="project-card-description">{{ item.body }}</p>
      {% if item.link %}
      <a class="btn btn-ghost elsewhere-link" href="{{ item.link.url | relative_url }}">
        {{ item.link.text }} &rarr;
      </a>
      {% endif %}
    </div>
    {% endfor %}
  </div>
</section>
