<section id="skills" aria-label="Skills">
  <h2><span>Core</span> Skills</h2>
  <div class="section-card">
    <div class="skills-grid">
      {% for group in site.data.skills %}
      <div class="skill-group">
        <h3>{{ group.group }}</h3>
        <ul>
          {% for item in group.items %}
          <li>{{ item }}</li>
          {% endfor %}
        </ul>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
