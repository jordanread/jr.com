# poems: every poem lives at /poetry/poem/<slug>/, whether it's a
#   standalone one-off or part of a series — the `series:` front matter
#   field (matching a poetry_collections item's filename/slug) is what
#   groups them, not the URL.
# poetry_collections: the curated landing pages for a series, one per
#   collection, at /poetry/<slug>/. A file named
#   _poetry_collections/lighthouse-keeper.md pairs with any poem that
#   sets `series: lighthouse-keeper`.
# photo_albums: thematic photo grids at /photography/album/<slug>/.
#   Bespoke scrollytelling pieces aren't a collection — they're just
#   standalone pages, listed alongside albums via _data/photo_features.yml.
#   Front matter shape (see _layouts/photo-album.html):
#     title, description, cover: <path>
#     images:
#       - src: <path>
#         alt: <string, required for accessibility>
#         caption: <string, optional>
# media: a log of movies/TV/books/games at /media/entry/<slug>/.
#   `type` (movie/tv/book/game/...) drives the filter pills on /media/.
#   `status` is optional and defaults, in effect, to "finished" — set
#   it to in-progress/dropped/on-hold to show a badge, and
#   in-progress specifically is what makes an entry show up on /now/
#   automatically. `date` doubles as "date finished" for finished
#   entries and "date started" for in-progress ones — it's just what
#   the feed sorts by, not a claim about which milestone it marks.
#   `rating` is 1-5, `cover` and `external_url` are both optional.
collections:
  poems:
    output: true
    permalink: /poetry/poem/:slug/
  poetry_collections:
    output: true
    permalink: /poetry/:slug/
  photo_albums:
    output: true
    permalink: /photography/album/:slug/
  media:
    output: true
    permalink: /media/entry/:slug/

# Applies _layouts/default.html to every page/post that doesn't set
# its own `layout` in front matter, so you don't have to repeat it
# everywhere. Pages that should NOT get a layout (like comparison.html,
# which is already a full standalone HTML document) override this
# with `layout: null` in their own front matter. Posts, poems, and
# collections get their own layouts instead (see below).
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "poems"
    values:
      layout: poem
  - scope:
      path: ""
      type: "poetry_collections"
    values:
      layout: poetry-collection
  - scope:
      path: ""
      type: "photo_albums"
    values:
      layout: photo-album
  - scope:
      path: ""
      type: "media"
    values:
      layout: media-entry

# GitHub Pages builds with a restricted plugin allowlist — these three
# are all on it and safe to ship as-is. Only add more here if you're
# building/deploying outside GitHub Pages' own build process.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
