# Jekyll site configuration
#
# NOTE: unlike _data, _includes, and pages, Jekyll only reads this
# file once at server start — editing it while `jekyll serve` is
# running won't take effect until you stop and restart.

title: "Jordan Read"
description: "Software engineer, entrepreneur, and maker."
url: "https://jordanread.com"
baseurl: ""

markdown: kramdown
permalink: pretty
excerpt_separator: <!--more-->

# TODO(jordan): email/phone/linkedin/github are placeholders — fill in
# before this goes live. Templates that reference them (header, hero,
# contact) already guard the optional ones with {% if %}, so leaving
# any of these blank just hides that element rather than breaking.
author:
  name: "Jordan Read"
  job_title: "Software Engineer & Solution Architect"
  email: ""
  phone: ""
  linkedin: ""
  github: ""
  resume_pdf: ""
  experience_since: "2006"
  current_focus: ".NET, Angular & Azure-backed systems"
  recent_roles: "National Seating & Mobility · Ektello (Allegion)"

nav:
  - title: "Home"
    anchor: "/"
  - title: "Blog"
    anchor: "/blog/"
  - title: "Resume"
    anchor: "/resume/"

# Applies _layouts/default.html to every page/post that doesn't set
# its own `layout` in front matter, so you don't have to repeat it
# everywhere. Pages that should NOT get a layout (like comparison.html,
# which is already a full standalone HTML document) override this
# with `layout: null` in their own front matter. Posts get the `post`
# layout instead (byline/date treatment, no splash intro).
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

# GitHub Pages builds with a restricted plugin allowlist — these three
# are all on it and safe to ship as-is. Only add more here if you're
# building/deploying outside GitHub Pages' own build process.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
