# Jekyll site configuration
#
# NOTE: unlike _data, _includes, and pages, Jekyll only reads this
# file once at server start — editing it while `jekyll serve` is
# running won't take effect until you stop and restart.

title: "Jordan Read"
description: >-
   "Portfolio site of me: software engineer, writer, and photographer. Code projects, essays, poetry, photography, and a running media log. If you find me on social media, you actually didn't. This is all there is. This is all there will ever be."
url: "https://jordanread.com"
baseurl: ""

markdown: kramdown
permalink: pretty
excerpt_separator: <!--more-->

# TODO(jordan): email/phone/linkedin/github/author.description are
# placeholders — fill in before this goes live. Templates that
# reference them (header, hero, contact) already guard the optional
# ones with {% if %}, so leaving any of these blank just hides that
# element rather than breaking.
#
# NOTE: author.description is separate from the top-level
# `description` above — that one feeds the SEO/meta description tag
# sitewide (and the homepage has no page.description of its own, so
# it depends on it entirely). author.description is just the
# personal-voice tagline home-hero.html shows in the hero, distinct
# from author.job_title (used by the formal resume hero).
author:
  name: "Jordan Read"
  job_title: "Software Engineer & Solution Architect"
  description: "Coder, Writer, Photographer. Human."
  email: ""
  phone: ""
  linkedin: "https://www.linkedin.com/in/jordanread/"
  github: "https://github.com/jordanread/"
  # Shown in the home hero panel. Deliberately not a city — replace
  # with wherever's true when you're editing this for real.
  home_base: "France"

# Resume-only fields. Kept separate from `author` on purpose: this is
# the stuff that reads like it's written for a recruiter, and it
# should only ever be pulled into resume-hero.html and the other
# resume-page includes (about/skills/experience/industries/contact) —
# never into home-hero.html or anything else the homepage uses. If a
# new template wants one of these, that's a sign it belongs on
# /resume/, not that it should reach into this block.
# Bookshop.org affiliate account. This is the numeric Affiliate ID
# shown under "Update My Profile" when logged in — e.g. their docs use
# 5780 as an example — NOT the "jordanread" storefront slug used in
# https://bookshop.org/shop/jordanread. Leave blank until you have it;
# book entries with an isbn13 just won't get an auto-generated Buy
# button until this is set (see the `media` collection notes below).
bookshop_affiliate_id: "126561"

resume:
  resume_pdf: ""
  current_focus: ".NET, Angular & Azure-backed systems"
  recent_roles: "Synergy UpLink"
  # Not read anywhere yet — here for whenever a computed "X years"
  # line gets added instead of the static "17+ years" in resume.html's
  # description and resume-hero.html's summary.
  experience_since: "2006"

nav:
  - title: "Home"
    anchor: "/"
  - title: "Articles"
    anchor: "/articles/"
  - title: "Projects"
    anchor: "/projects/"
    children:
      - title: "Poetry"
        anchor: "/projects/poetry/"
      - title: "Photography"
        anchor: "/projects/photography/"
      - title: "Code"
        anchor: "/projects/code/"
  - title: "Media"
    anchor: "/media/"
  - title: "Now"
    anchor: "/now/"
  - title: "Resume"
    anchor: "/resume/"

# poems: every poem lives at /projects/poetry/poem/<slug>/, whether
#   it's a standalone one-off or part of a series — the `series:`
#   front matter field (matching a poetry_collections item's
#   filename/slug) is what groups them, not the URL.
# poetry_collections: the curated landing pages for a series, one per
#   collection, at /projects/poetry/<slug>/. A file named
#   _poetry_collections/lighthouse-keeper.md pairs with any poem that
#   sets `series: lighthouse-keeper`.
# photo_albums: thematic photo grids at /projects/photography/album/<slug>/.
#   Bespoke scrollytelling pieces aren't a collection — they're just
#   standalone pages, listed alongside albums via _data/photo_features.yml.
#   Front matter shape (see _layouts/photo-album.html):
#     title, description, cover: <path>
#     images:
#       - src: <path>
#         alt: <string, required for accessibility>
#         caption: <string, optional>
# media: a log of movies/TV/books/games/podcasts at /media/entry/<slug>/.
#   `type` (movie/tv/book/game/podcast/...) drives the filter pills
#   on /media/ — any new type just works, no config change needed.
#   `status` is optional and defaults, in effect, to "finished" — set
#   it to in-progress/dropped/on-hold/ongoing to show a badge.
#   in-progress and ongoing are both what make an entry show up on
#   /now/ automatically. `date` doubles as "date finished" for
#   finished entries, "date started" for in-progress ones (implies
#   it'll eventually flip to finished), and "date last played" for
#   ongoing ones (things with no real finish line — bump it whenever
#   you feel like, no obligation to keep it current) — it's just
#   what the feed sorts by, not a claim about which milestone it
#   marks. `rating` is 1-5, `cover` and `external_url` are both
#   optional. All factual data (author/developer/host, published/
#   released, pages/platforms, genres, series, collected_books,
#   network, episodes, run, synopsis) belongs in front matter and is
#   rendered by the layout — body content is reserved for your own
#   review/voice, and can be left empty while an entry is stubbed
#   out. A podcast entry doesn't need to still be airing — `run`
#   (e.g. "2018–2021") communicates the show itself has wrapped,
#   independent of your own `status`. `affiliate_url` (optional,
#   with an `affiliate_label` override) renders a separate button
#   from `external_url` alongside a disclosure line, so an entry can
#   link to both an official/info page and a purchase link.
#   For books, `isbn13` is enough on its own — if `bookshop_affiliate_id`
#   below is set, the layout builds a bookshop.org affiliate link from
#   isbn13 automatically, so you don't need to hand-set affiliate_url
#   per book. An explicit `affiliate_url` on an entry always wins over
#   the auto-generated one (e.g. to keep an existing Amazon link).
# code_projects: open-source/personal code projects at
#   /projects/code/<slug>/. `status` is a free-text string, not a
#   fixed enum — "Idea", "Early development", "Work in progress",
#   "Shipped", whatever fits. `repo_url` is optional, which is the
#   point: a project can exist here with just a title, description,
#   and status before any code exists at all. `stack` is a short list
#   of tags, same as the old homepage projects.yml.
# articles: standalone pieces at /articles/<slug>/ — no date-encoded
#   permalink, unlike Jekyll's built-in posts. `title` and `tags`
#   (optional list) are the only fields the layout expects; `date` is
#   optional too — it's shown if present and used for sort order on
#   /articles/, but isn't required, since these are meant to be
#   standalone reads rather than a chronological log. `description`
#   is an optional short blurb for the index card; if it's missing
#   the index falls back to an auto-generated excerpt.
collections:
  poems:
    output: true
    permalink: /projects/poetry/poem/:slug/
  poetry_collections:
    output: true
    permalink: /projects/poetry/:slug/
  photo_albums:
    output: true
    permalink: /projects/photography/album/:slug/
  media:
    output: true
    permalink: /media/entry/:slug/
  code_projects:
    output: true
    permalink: /projects/code/:slug/
  articles:
    output: true
    permalink: /articles/:slug/

# Applies _layouts/default.html to every page/post that doesn't set
# its own `layout` in front matter, so you don't have to repeat it
# everywhere. Pages that should NOT get a layout (like comparison.html,
# which is already a full standalone HTML document) override this
# with `layout: null` in their own front matter. Posts, poems, and
# collections get their own layouts instead (see below).
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: "articles"
    values:
      layout: article
  - scope:
      path: ""
      type: "poems"
    values:
      layout: poem
  - scope:
      path: ""
      type: "poetry_collections"
    values:
      layout: poetry-collection
  - scope:
      path: ""
      type: "photo_albums"
    values:
      layout: photo-album
  - scope:
      path: ""
      type: "media"
    values:
      layout: media-entry
  - scope:
      path: ""
      type: "code_projects"
    values:
      layout: code-project

# GitHub Pages builds with a restricted plugin allowlist — these three
# are all on it and safe to ship as-is. Only add more here if you're
# building/deploying outside GitHub Pages' own build process.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
