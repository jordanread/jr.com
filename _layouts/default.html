<!--
  _layouts/default.html

  This is a minimal skeleton, not a reconstruction of your existing
  resume page's nav/header/footer/styling — I don't have visibility
  into that markup. Drop your existing structure in around
  `{{ content }}` below; the two things that actually matter for the
  splash to work are the splash-head.html include staying early in
  <head>, and splash.html staying right after <body> opens.

  For this layout to apply to a page at all, that page needs front
  matter — even an empty `---\n---` is enough. A plain .html file
  with no front matter is treated as a static asset and Jekyll won't
  touch it (no layout, no Liquid, no splash). If your current resume
  page is a bare .html file, that's likely why the splash isn't
  showing up there.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">

{% include splash-head.html %}

<!-- NOTE: point this at wherever your actual site stylesheet lives.
     This is a placeholder path — adjust to match your project. -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

{% seo %}
</head>
<body>

{% include splash.html %}

<main>
  {{ content }}
</main>

</body>
</html>
