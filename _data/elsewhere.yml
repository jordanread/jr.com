- title: "Four Years Off the Grid"
  tag: "Self-Sufficiency"
  body: >-
    Lived aboard a sailboat with no shore power for four years. Solar,
    rainwater, and knowing how to fix things yourself stop being
    hobbies pretty quickly when they're how the week actually runs.

