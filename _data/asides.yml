- title: "Roamer, Wanderer, Nomad, Vagabond"
  tag: "Travel"
  body: >-
    Call me what you will (bonus points for the melody playing in your head). 
    I never liked the idea of being tied to a place, so I'm not. 
    The world is a big place, and every part of it has it's own quirks. 
    I have intentionally crafted my life so that I get to experience those quirks every day.
  link:
    text: "See where"
    url: "/now/"

- title: "The Marrow of Life"
  tag: "Lifestyle"
  body: >-
    I heard some variation of what most of us hear: "Grow up", "Settle down", "Build a life". 
    As far as advice goes, I've received worse (there was this thing about kiwi skins - so many wasted years). 
    It was the unspoken addendum that didn't sit right with me: "And then die". 
    There had to be more than that, and with the unwavering confidence of youth, I knew it was there and I knew I could find it.
  # link:
  #   text: "See where"
  #   url: "/now/"

- title: "Comfort? Nah. Risk!"
  tag: "Philosophy"
  body: >-
    At one point, someone must have told me about the "comfort zone". 
    And then I had to have heard an anecdote about getting out of it to grow and progress.
    No clue when or where, but it got internalized. So much so that I have been told that my comfort zone is being out of my comfort zone.
    If it seems scary or weird, that's a reason to do it, not a reason to avoid it.

